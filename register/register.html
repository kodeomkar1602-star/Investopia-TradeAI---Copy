<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your Investopia TradeAI account">
    <meta name="theme-color" content="#16a34a">

    <title>Create Account | Investopia TradeAI</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <!-- Page CSS -->
    <link rel="stylesheet" href="register.css">

</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar fixed-top">

    <div class="container">

        <!-- Logo -->

        <a
            href="../home/home.html"
            class="navbar-brand fw-bold"
            aria-label="Investopia TradeAI Home"
        >

            <i class="bi bi-graph-up-arrow"></i>

            Investopia <span>TradeAI</span>

        </a>


        <!-- Navigation Actions -->

        <div class="d-flex align-items-center gap-2">

            <!-- Theme -->

            <button
                class="theme-btn"
                id="themeToggle"
                type="button"
                aria-label="Toggle dark and light theme"
                title="Toggle theme"
            >

                <i
                    class="bi bi-moon-stars"
                    id="themeIcon"
                ></i>

            </button>


            <!-- Home -->

            <a
                href="../home/home.html"
                class="btn btn-outline-success d-none d-sm-inline-flex"
            >

                <i class="bi bi-house"></i>

                Home

            </a>

        </div>

    </div>

</nav>


<!-- ================= REGISTER PAGE ================= -->

<main class="register-page">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-12 col-sm-11 col-md-8 col-lg-6 col-xl-5">

                <div class="register-card">

                    <!-- Header -->

                    <div class="text-center mb-4">

                        <div class="register-icon">

                            <i class="bi bi-person-plus"></i>

                        </div>

                        <h1>Create your account</h1>

                        <p>

                            Start your smarter investing journey with

                            <strong>Investopia TradeAI</strong>.

                        </p>

                    </div>


                    <!-- Registration Form -->

                    <form id="registerForm">

                        <!-- Full Name -->

                        <div class="form-group mb-3">

                            <label for="fullName">
                                Full Name
                            </label>

                            <div class="input-wrapper">

                                <i class="bi bi-person"></i>

                                <input
                                    type="text"
                                    id="fullName"
                                    name="fullName"
                                    class="form-control"
                                    placeholder="Enter your full name"
                                    autocomplete="name"
                                    required
                                >

                            </div>

                        </div>


                        <!-- Email -->

                        <div class="form-group mb-3">

                            <label for="email">
                                Email Address
                            </label>

                            <div class="input-wrapper">

                                <i class="bi bi-envelope"></i>

                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    class="form-control"
                                    placeholder="Enter your email"
                                    autocomplete="email"
                                    required
                                >

                            </div>

                        </div>


                        <!-- Password -->

                        <div class="form-group mb-3">

                            <label for="password">
                                Password
                            </label>

                            <div class="input-wrapper">

                                <i class="bi bi-lock"></i>

                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    class="form-control"
                                    placeholder="Create a password"
                                    autocomplete="new-password"
                                    minlength="8"
                                    required
                                >

                                <button
                                    type="button"
                                    class="password-toggle"
                                    id="passwordToggle"
                                    aria-label="Show password"
                                >

                                    <i
                                        class="bi bi-eye"
                                        id="passwordIcon"
                                    ></i>

                                </button>

                            </div>


                            <!-- Password Strength -->

                            <div class="password-strength mt-2">

                                <div class="strength-bar">

                                    <span id="strengthBar"></span>

                                </div>

                                <small id="strengthText">
                                    Use at least 8 characters
                                </small>

                            </div>

                        </div>


                        <!-- Confirm Password -->

                        <div class="form-group mb-3">

                            <label for="confirmPassword">
                                Confirm Password
                            </label>

                            <div class="input-wrapper">

                                <i class="bi bi-shield-lock"></i>

                                <input
                                    type="password"
                                    id="confirmPassword"
                                    name="confirmPassword"
                                    class="form-control"
                                    placeholder="Confirm your password"
                                    autocomplete="new-password"
                                    required
                                >

                                <button
                                    type="button"
                                    class="password-toggle"
                                    id="confirmPasswordToggle"
                                    aria-label="Show confirm password"
                                >

                                    <i
                                        class="bi bi-eye"
                                        id="confirmPasswordIcon"
                                    ></i>

                                </button>

                            </div>

                        </div>


                        <!-- Risk Preference -->

                        <div class="form-group mb-3">

                            <label for="riskLevel">
                                Investment Experience
                            </label>

                            <div class="input-wrapper select-wrapper">

                                <i class="bi bi-bar-chart"></i>

                                <select
                                    id="riskLevel"
                                    name="riskLevel"
                                    class="form-select"
                                >

                                    <option value="" selected>
                                        Select your experience level
                                    </option>

                                    <option value="beginner">
                                        Beginner
                                    </option>

                                    <option value="intermediate">
                                        Intermediate
                                    </option>

                                    <option value="advanced">
                                        Advanced
                                    </option>

                                </select>

                            </div>

                        </div>


                        <!-- Terms -->

                        <div class="form-check my-3">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="terms"
                                required
                            >

                            <label
                                class="form-check-label"
                                for="terms"
                            >

                                I agree to the

                                <a href="#">
                                    Terms & Conditions
                                </a>

                                and

                                <a href="#">
                                    Privacy Policy
                                </a>.

                            </label>

                        </div>


                        <!-- Register Button -->

                        <button
                            type="submit"
                            class="btn btn-success register-btn w-100"
                            id="registerButton"
                        >

                            Create My Account

                            <i class="bi bi-arrow-right"></i>

                        </button>

                    </form>


                    <!-- Divider -->

                    <div class="divider">

                        <span>
                            Already registered?
                        </span>

                    </div>


                    <!-- Login -->

                    <a
                        href="../login/login.html"
                        class="login-link-btn w-100"
                    >

                        <i class="bi bi-box-arrow-in-right"></i>

                        Login to your account

                    </a>


                    <!-- Security -->

                    <div class="security-note text-center">

                        <i class="bi bi-shield-check"></i>

                        Your information is securely protected.

                    </div>

                </div>

            </div>

        </div>

    </div>

</main>


<!-- ================= FOOTER ================= -->

<footer>

    <div class="container text-center">

        <p class="mb-1">
            © 2026 Investopia TradeAI
        </p>

        <div class="footer-links">

            <a href="../home/home.html">
                Home
            </a>

            <a href="../login/login.html">
                Login
            </a>

            <a href="../learning/learning.html">
                Learning
            </a>

        </div>

    </div>

</footer>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
></script>


<!-- ============================================================
     SUPABASE
     ============================================================ -->

<!-- Supabase JavaScript Library -->
<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<!-- Your Supabase Configuration -->
<script src="../auth/supabase.js"></script>


<!-- Page JS -->

<script src="register.js"></script>

</body>

</html>
