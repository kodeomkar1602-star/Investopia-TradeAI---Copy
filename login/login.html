<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to Investopia TradeAI">
    <meta name="theme-color" content="#16a34a">

    <title>Login | Investopia TradeAI</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <!-- Page CSS -->
    <link rel="stylesheet" href="login.css">

</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar fixed-top">

    <div class="container">

        <a
            href="../home/home.html"
            class="navbar-brand fw-bold"
            aria-label="Investopia TradeAI Home"
        >

            <i class="bi bi-graph-up-arrow"></i>

            Investopia <span>TradeAI</span>

        </a>


        <div class="d-flex align-items-center gap-2">

            <!-- Theme -->

            <button
                class="theme-btn"
                id="themeToggle"
                type="button"
                aria-label="Toggle dark and light theme"
                title="Toggle theme"
            >

                <i
                    class="bi bi-moon-stars"
                    id="themeIcon"
                ></i>

            </button>


            <a
                href="../home/home.html"
                class="btn btn-outline-success d-none d-sm-inline-flex"
            >

                <i class="bi bi-house"></i>

                Home

            </a>

        </div>

    </div>

</nav>


<!-- ================= LOGIN SECTION ================= -->

<main class="login-page">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">

                <div class="login-card">

                    <!-- Header -->

                    <div class="text-center mb-4">

                        <div class="login-icon">

                            <i class="bi bi-person-lock"></i>

                        </div>

                        <h1>Welcome back</h1>

                        <p>

                            Login to continue to your

                            <strong>Investopia</strong> account.

                        </p>

                    </div>


                    <!-- Login Form -->

                    <form id="loginForm">

                        <!-- Email -->

                        <div class="form-group mb-3">

                            <label for="email">
                                Email Address
                            </label>

                            <div class="input-wrapper">

                                <i class="bi bi-envelope"></i>

                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    class="form-control"
                                    placeholder="Enter your email"
                                    autocomplete="email"
                                    required
                                >

                            </div>

                        </div>


                        <!-- Password -->

                        <div class="form-group mb-2">

                            <div class="d-flex justify-content-between">

                                <label for="password">
                                    Password
                                </label>

                                <a
                                    href="#"
                                    class="forgot-link"
                                >
                                    Forgot password?
                                </a>

                            </div>


                            <div class="input-wrapper">

                                <i class="bi bi-lock"></i>

                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    class="form-control"
                                    placeholder="Enter your password"
                                    autocomplete="current-password"
                                    required
                                >

                                <button
                                    type="button"
                                    class="password-toggle"
                                    id="passwordToggle"
                                    aria-label="Show password"
                                >

                                    <i
                                        class="bi bi-eye"
                                        id="passwordIcon"
                                    ></i>

                                </button>

                            </div>

                        </div>


                        <!-- Remember -->

                        <div class="form-check my-3">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="rememberMe"
                            >

                            <label
                                class="form-check-label"
                                for="rememberMe"
                            >
                                Remember me
                            </label>

                        </div>


                        <!-- Login Button -->

                        <button
                            type="submit"
                            class="btn btn-success login-btn w-100"
                            id="loginButton"
                        >

                            Login to Investopia

                            <i class="bi bi-arrow-right"></i>

                        </button>

                    </form>


                    <!-- Divider -->

                    <div class="divider">

                        <span>or</span>

                    </div>


                    <!-- Demo Login -->

                    <button
                        type="button"
                        class="demo-btn w-100"
                        id="demoLogin"
                    >

                        <i class="bi bi-play-circle"></i>

                        Try Demo Account

                    </button>


                    <!-- Register -->

                    <p class="register-text text-center mt-4 mb-0">

                        Don't have an account?

                        <a href="../register/register.html">
                            Create one
                        </a>

                    </p>

                </div>


                <!-- Security Note -->

                <div class="security-note text-center">

                    <i class="bi bi-shield-check"></i>

                    Your account information is securely protected.

                </div>

            </div>

        </div>

    </div>

</main>


<!-- ================= FOOTER ================= -->

<footer class="text-center">

    <div class="container">

        <p class="mb-1">
            © 2026 Investopia TradeAI
        </p>

        <div class="footer-links">

            <a href="../home/home.html">
                Home
            </a>

            <a href="../register/register.html">
                Register
            </a>

            <a href="../learning/learning.html">
                Learning
            </a>

        </div>

    </div>

</footer>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
></script>


<!-- ============================================================
     SUPABASE
     ============================================================ -->

<!-- Supabase JavaScript Library -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<!-- Your Supabase Configuration -->

<script src="../auth/supabase.js"></script>


<!-- Page JS -->

<script src="login.js"></script>

</body>

</html>
